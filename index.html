<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Saurav Poudel’s portfolio in data engineering, software, machine learning, and applied AI.">
  <meta name="theme-color" content="#000000">
  <title>Saurav Poudel — Portfolio</title>
  <link rel="preload" href="fonts/LeagueSpartan.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css?v=sapo-profile">
  <script defer src="landing-data.js?v=sapo-profile"></script>
  <script defer src="behance-works.js?v=sapo-profile"></script>
  <script defer src="sapo-profile.js?v=1"></script>
  <script defer src="sapo-search.js?v=1"></script>
  <script defer src="stars.js?v=solar-2"></script>
  <script defer src="earth.js?v=sapo-dock"></script>
  <script defer src="site-shell.js?v=sapo-profile"></script>
  <script defer src="landing.js?v=sapo-profile"></script>
  <link rel="stylesheet" href="solar.css?v=case-studies">
  <link rel="stylesheet" href="sapo-dock.css?v=invite">
  <link rel="stylesheet" href="sapo-buddy.css?v=momo">
  <link rel="stylesheet" href="sapo-portrait.css?v=sapo">
  <script defer src="sapo-portrait.js?v=portrait"></script>
  <script defer src="solar.js?v=solar-2"></script>
  <script defer src="sapo-buddy.js?v=ambient"></script>
  <script defer src="sapo-invite.js?v=sapo-profile"></script>
</head>
<body data-page="about">
  <canvas id="stars" aria-hidden="true"></canvas>
  <a class="skip" href="#introduction">Skip to introduction</a>
  <div class="loader" aria-hidden="true"><canvas id="loader-earth"></canvas></div>
  <main>
    <section class="hero" id="about" aria-labelledby="profile-name" tabindex="-1">
      <div class="globe-stage">
        <canvas id="earth" aria-hidden="true"></canvas>
        <h1 id="profile-name" aria-label="Saurav Poudel">.sapo</h1>
      </div>
    </section>
    <section class="profile content-section" id="introduction" aria-label="Introduction" tabindex="-1">
      <figure class="portrait-collage">
        <div class="portrait-papers" aria-hidden="true">
          <span class="portrait-paper portrait-paper-blue"></span>
          <span class="portrait-paper portrait-paper-lilac"></span>
          <span class="portrait-paper portrait-paper-green"></span>
          <span class="portrait-orbit"></span>
        </div>
        <button class="portrait-button" type="button" aria-label="Wave to the portfolio companion">
          <span class="portrait-person">
            <img class="portrait-photo" src="assets/sapo-portrait.webp" width="643" height="1821" alt="Saurav Poudel in a black coat" decoding="async">
            <span class="portrait-shutter" aria-hidden="true"></span>
            <span class="portrait-shutter" aria-hidden="true"></span>
            <span class="portrait-shutter" aria-hidden="true"></span>
            <span class="portrait-shutter" aria-hidden="true"></span>
          </span>
        </button>
      </figure>
      <p class="role" id="role">Data · Software · AI</p>
      <p class="intro" id="intro"></p>
      <div class="actions">
        <a class="button primary" href="resume.html?v=timeline">View résumé</a>
        <button class="button" id="hero-contact" type="button" aria-controls="contact-panel" aria-expanded="false">Contact</button>
      </div>
    </section>
  </main>
</body>
</html>
