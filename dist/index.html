<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Saurav Poudel’s portfolio in data engineering, software, machine learning, and applied AI.">
  <meta name="theme-color" content="#000000">
  <title>Saurav Poudel — Portfolio</title>
  <link rel="preload" href="fonts/LeagueSpartan.ttf" as="font" type="font/ttf" crossorigin>
  <link rel="stylesheet" href="style.css?v=sapo-retrieval">
  <script defer src="landing-data.js?v=sapo-profile"></script>
  <script defer src="behance-works.js?v=sapo-profile"></script>
  <script defer src="sapo-profile.js?v=2"></script>
  <script defer src="sapo-language.js?v=1"></script>
  <script defer src="sapo-search.js?v=3"></script>
  <script defer src="stars.js?v=solar-2"></script>
  <script defer src="earth.js?v=landing-sky"></script>
  <script defer src="site-shell.js?v=dot-sapo"></script>
  <script defer src="landing.js?v=sapo-retrieval"></script>
  <link rel="stylesheet" href="solar.css?v=case-studies">
  <link rel="stylesheet" href="sapo-dock.css?v=invite">
  <link rel="stylesheet" href="sapo-buddy.css?v=momo">
  <link rel="stylesheet" href="landing-scene.css?v=3">
  <link rel="stylesheet" href="landing-showcase.css?v=2">
  <script defer src="landing-scene.js?v=1"></script>
  <script defer src="landing-showcase.js?v=2"></script>
  <script defer src="solar.js?v=solar-2"></script>
  <script defer src="sapo-buddy.js?v=ambient"></script>
  <script defer src="sapo-invite.js?v=dot-sapo"></script>
</head>
<body data-page="about">
  <canvas id="stars" aria-hidden="true"></canvas>
  <a class="skip" href="#introduction">Skip to introduction</a>
  <div class="loader" aria-hidden="true"><canvas id="loader-earth"></canvas></div>
  <main>
    <section class="hero" id="about" aria-labelledby="profile-name" tabindex="-1">
      <div class="globe-stage">
        <canvas id="earth" aria-hidden="true"></canvas>
        <h1 id="profile-name" aria-label="Saurav Poudel">.sapo</h1>
      </div>
    </section>
    <section class="landing-introduction" id="introduction" aria-label="Introduction" tabindex="-1">
      <figure class="landing-scene">
        <div class="landing-scene-composite">
          <canvas id="landing-sky" class="landing-sky" aria-hidden="true"></canvas>
          <div class="landing-atmosphere" aria-hidden="true">
            <span class="landing-orbit"><span></span></span>
            <span class="landing-orbit landing-orbit-wide"><span></span></span>
            <span class="landing-meteor"></span>
            <span class="landing-meteor landing-meteor-far"></span>
          </div>
          <img class="landing-landscape" src="assets/golden-gate-foreground.webp" width="2364" height="1330" alt="Saurav Poudel pointing toward the Golden Gate Bridge" decoding="async" loading="lazy">
          <button class="landing-scene-wave" type="button" aria-label="Wave to the portfolio companion">
            <span aria-hidden="true" class="landing-wave-marker">✦</span>
          </button>
        </div>
      </figure>
      <div class="profile content-section">
        <p class="role" id="role">Data · Software · AI</p>
        <p class="intro" id="intro"></p>
        <div class="actions">
          <a class="button primary" href="resume.html?v=timeline">View résumé</a>
          <button class="button" id="hero-contact" type="button" aria-controls="contact-panel" aria-expanded="false">Contact</button>
        </div>
      </div>
    </section>
    <section class="landing-showcase" id="landing-showcase" aria-label="Work and tools"></section>
  </main>
</body>
</html>
